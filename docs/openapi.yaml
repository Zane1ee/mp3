      "where": {
        "name": "where",
        "in": "query",
        "content": {
          "application/json": {
            "schema": {
              "type": "object"
            }
          }
        },
        "description": "JSON encoded where; see api-contract.md for validation/composition."
      },
      "sort": {
        "name": "sort",
        "in": "query",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": {
                "type": "integer",
                "enum": [
