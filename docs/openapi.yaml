  "components": {
    "schemas": {
      "User": {
        "type": "object",
        "properties": {
          "_id": {
            "type": "string",
            "pattern": "^[a-fA-F0-9]{24}$"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "pendingTasks": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-fA-F0-9]{24}$"
            }
          },
          "dateCreated": {
            "type": "string",
            "format": "date-time",
            "readOnly": true
          }
        },
        "required": [
          "_id",
          "name",
          "email",
          "pendingTasks",
          "dateCreated"
        ]
      },
      "Task": {
        "type": "object",
        "properties": {
          "_id": {
            "type": "string",
            "pattern": "^[a-fA-F0-9]{24}$"
          },
          "name": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "deadline": {
            "type": "string",
            "format": "date-time"
          },
          "completed": {
            "type": "boolean"
          },
          "assignedUser": {
            "type": "string"
          },
          "assignedUserName": {
            "type": "string"
          },
          "dateCreated": {
            "type": "string",
            "format": "date-time",
            "readOnly": true
          }
        },
        "required": [
          "_id",
          "name",
          "description",
          "deadline",
          "completed",
          "assignedUser",
          "assignedUserName",
          "dateCreated"
        ]
      },
      "ProjectedUser": {
        "type": "object",
        "properties": {
          "_id": {
            "type": "string",
            "pattern": "^[a-fA-F0-9]{24}$"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "pendingTasks": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-fA-F0-9]{24}$"
            }
          },
          "dateCreated": {
            "type": "string",
            "format": "date-time",
            "readOnly": true
          }
        }
      },
      "ProjectedTask": {
        "type": "object",
        "properties": {
          "_id": {
            "type": "string",
            "pattern": "^[a-fA-F0-9]{24}$"
          },
          "name": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "deadline": {
            "type": "string",
            "format": "date-time"
          },
          "completed": {
            "type": "boolean"
          },
          "assignedUser": {
            "type": "string"
          },
          "assignedUserName": {
            "type": "string"
          },
          "dateCreated": {
            "type": "string",
            "format": "date-time",
            "readOnly": true
          }
        }
      },
      "UserInput": {
        "type": "object",
        "required": [
          "name",
          "email"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "email": {
            "type": "string",
            "pattern": "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          },
          "pendingTasks": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-fA-F0-9]{24}$"
            },
            "uniqueItems": true,
            "default": []
          }
        },
        "description": "Unknown/server-owned properties are ignored. pendingTasks defaults to []."
      },
      "TaskInput": {
        "type": "object",
        "required": [
          "name",
          "deadline"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "description": {
            "type": "string",
            "default": ""
          },
          "deadline": {
            "type": "string",
            "description": "Valid calendar date or date-time; no future-only restriction."
          },
          "completed": {
            "type": "boolean",
            "default": false
          },
          "assignedUser": {
            "oneOf": [
              {
                "type": "string",
                "const": ""
              },
              {
                "type": "string",
                "pattern": "^[a-fA-F0-9]{24}$"
              }
            ],
            "default": ""
          },
          "assignedUserName": {
            "type": "string"
          }
        },
        "description": "Valid date strings include date-only values. Optional defaults and derived assignedUserName follow api-contract.md."
      },
      "Error": {
        "type": "object",
        "required": [
          "message",
          "data"
        ],
        "additionalProperties": false,
        "properties": {
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "maxProperties": 0
          }
        }
      },
      "UserResponse": {
        "type": "object",
        "required": [
          "message",
          "data"
        ],
        "additionalProperties": false,
        "properties": {
          "message": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/ProjectedUser"
          }
        }
      },
      "UserListResponse": {
        "type": "object",
        "required": [
          "message",
          "data"
        ],
        "additionalProperties": false,
        "properties": {
          "message": {
            "type": "string"
          },
          "data": {
            "oneOf": [
              {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/User"
                }
              },
              {
                "type": "integer",
                "minimum": 0
              }
            ]
          }
        }
      },
      "TaskResponse": {
